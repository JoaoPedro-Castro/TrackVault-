<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>TrackVault | Cadastro</title>

  <script src="./js/sessao.js"></script>

  <link rel="stylesheet" href="./css/cadastro.css" />
  <link rel="icon" href="assets/logo.png" />
  <link rel="preconnect" href="https://fonts.gstatic.com" />
</head>

<body class="pagina-cadastro">
  <!--header inicio-->
  <div class="header">
    <div class="container">
      <h1 class="titulo">TrackVault</h1>
      <ul class="navbar">
        <li>
          <a href="index.html">Home</a>
        </li>
        <li>
          <a href="simulador.html">Sobre nós</a>
        </li>
        <li>|</li>
        <li>
          <a href="login.html">Login</a>
        </li>
        <li class="agora">
          <a href="#">Cadastro</a>
        </li>
      </ul>
    </div>
  </div>
  <!--header fim-->

  <div class="login">
    <div class="alerta_erro">
      <div class="card_erro" id="cardErro">
        <span id="mensagem_erro"></span>
      </div>
    </div>
    <div class="container">
      <div class="card card-cadastro">
        <h2>Bem-vindo!</h2>
        <p class="subtitulo-cadastro">Crie sua conta e faça parte do TrackVault</p> 
        <div class="formulario">

          <div class="campo">
            <span>Nome:</span>
            <input id="nome_input" type="text" placeholder="Seu nome" />
          </div>
          <div class="campo">
            <span>E-mail:</span>
            <input id="email_input" type="text" placeholder="digiteseu@email.com" />
          </div>
          <div class="campo">
            <span>Senha:</span>
            <input id="senha_input" type="password" placeholder="******" />
          </div>
          <div class="campo">
            <span>Confirmação da Senha:</span>
            <input id="confirmacao_senha_input" type="password" placeholder="******" />
          </div>
          <button class="botao" onclick="cadastrar()">Cadastrar →</button> 
        </div>
        <div id="div_aguardar" class="loading-div">
          <img src="./assets/circle-loading.gif" id="loading-gif" />
        </div>

        <div id="div_erros_login"></div>
      </div>
    </div>
  </div>

  <!--footer inicio-->
  <div class="footer">
    <div class="container">
      <h4>Mais que musica, uma experiência</h4>
    </div>
  </div>
  <!--footer fim-->
</body>

</html>

<script>
  function cadastrar() {
    aguardar();

    var nomeVar = nome_input.value.trim();
    var emailVar = email_input.value.trim();
    var senhaVar = senha_input.value;
    var confirmacaoSenhaVar = confirmacao_senha_input.value;

    if (nomeVar == "" || emailVar == "" || senhaVar == "" || confirmacaoSenhaVar == "") {
      mostrarMensagem("Preencha todos os campos.");
      finalizarAguardar();
      return false;
    }

    if (senhaVar != confirmacaoSenhaVar) {
      mostrarMensagem("As senhas não conferem.");
      finalizarAguardar();
      return false;
    }

    fetch("/usuarios/cadastrar", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        nomeServer: nomeVar,
        emailServer: emailVar,
        senhaServer: senhaVar
      }),
    })
      .then(function (resposta) {
        if (resposta.ok) {
          mostrarMensagem("Cadastro realizado com sucesso! Redirecionando para o Login...");
          setTimeout(function () {
            window.location = "login.html";
          }, 2000);
          finalizarAguardar();
        } else {
          return resposta.json().then(function (msg) {
            throw msg;
          });
        }
      })
      .catch(function (erro) {
        console.log("#ERRO: " + erro);
        mostrarMensagem(typeof erro == "string" ? erro : "Houve um erro ao tentar realizar o cadastro!");
        finalizarAguardar();
      });

    return false;
  }

  function mostrarMensagem(texto) {
    cardErro.style.display = "block";
    mensagem_erro.innerHTML = texto;
    setTimeout(function () {
      cardErro.style.display = "none";
    }, 5000);
  }
</script>
